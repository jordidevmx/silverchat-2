<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var themes = ["light", "dark", "system"];
          var accents = ["blue", "purple", "red", "orange", "yellow", "green"];
          var languages = ["en", "es"];
          var read = function (key) {
            return localStorage.getItem("silverchat_" + key);
          };
          var theme = read("theme");
          if (themes.indexOf(theme) === -1) theme = "system";
          var accent = read("accent");
          if (accents.indexOf(accent) === -1) accent = "blue";
          var dark =
            theme === "dark" ||
            (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.setAttribute("data-theme", "dark");
          else root.removeAttribute("data-theme");
          for (var i = 0; i < accents.length; i++) root.classList.remove("theme-" + accents[i]);
          root.classList.add("theme-" + accent);
          var language = read("language");
          if (languages.indexOf(language) === -1) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            language = "en";
            for (var t = 0; t < tags.length; t++) {
              var primary = String(tags[t] || "").split("-")[0].toLowerCase();
              if (languages.indexOf(primary) !== -1) {
                language = primary;
                break;
              }
            }
          }
          root.lang = language;
        } catch (error) {
          // Storage can be unavailable (Safari private mode); runtime providers still apply preferences.
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0082ff" />
    <meta name="referrer" content="no-referrer" />

    <!--
      The head block below is generated at build time from
      scripts/site-metadata.ts so the canonical URL, the Open Graph card, the
      Twitter card and the sitemap always agree. Do not edit it by hand.
    -->
    <!-- seo:start -->
    <!-- seo:end -->

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SilverChat" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
